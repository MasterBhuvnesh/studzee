<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>studzee</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- Clerk talks to the instance domain on *.clerk.accounts.dev, so it is
         allowed for connections. Production keys on a custom domain answer on
         *.clerk.app instead. clerk-js itself is served same-origin from
         public/clerk.browser.js (copied from @clerk/clerk-js) and loaded
         before the app, which skips the CDN entirely. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.studzee.in https://*.clerk.accounts.dev https://*.clerk.app https://clerk.telemetry.com"
    />
    <script src="/clerk.browser.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
