# GitHub Actions Workflow for Docker Backend Deployment
#
# The image is gated on the test suite. The build job does not start unless
# lint, typecheck and Vitest all pass, so a tag can no longer publish an image
# that fails its own tests.
name: Build, Tag, and Deploy Docker Image - Backend

on:
  push:
    tags:
      - "backend-v*"
    # Uncomment the following lines when we want to trigger on branch pushes as well
    # branches:
    #   - 'production'
  # Runs the whole pipeline by hand without cutting a tag. The version then
  # falls back to the short commit SHA.
  workflow_dispatch:

# The token only ever reads the repository here. The image is pushed to Docker
# Hub with its own credentials, so nothing in this pipeline needs write access
# to GitHub.
permissions:
  contents: read

# Two tags pushed close together would otherwise race, and the slower run could
# publish an older image over `latest`. Queued rather than cancelled, because a
# release build that has started should finish.
concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    # The suite finishes in well under a minute. This is a hang guard, so a
    # wedged run does not sit on a runner for the six hour default.
    timeout-minutes: 15

    # The integration tests talk to real Mongo and Redis. Postgres is not here
    # on purpose: the readiness and notification tests mock Prisma, so nothing
    # in the suite opens a Postgres connection.
    services:
      mongo:
        image: mongo:7
        env:
          # Must match the defaults in src/tests/setup/globalSetup.ts, which
          # mirror the ones docker-compose.yml falls back to. Mongoose connects
          # lazily, so a credentials mismatch here does not fail the connection.
          # It fails the first query with "Command find requires authentication".
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./BACKEND

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the node:22-alpine base image the Dockerfile builds on.
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install dependencies
        # npm ci rather than npm install, so the lockfile is what gets tested.
        run: npm ci

      - name: Generate the Prisma client
        # The client is generated into node_modules and is not committed, so
        # the typecheck cannot resolve @prisma/client without this step.
        run: npx prisma generate

      - name: Check formatting
        # Enabled on 14-08-2026, once .gitattributes forced LF in the working
        # tree. Before that this step failed on several thousand CRLF
        # differences, because CI checks out on Linux and the maintainer works
        # on Windows with core.autocrlf=true.
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # The base tsconfig, not tsconfig.build.json, so the tests are checked
        # too. Vitest transpiles without typechecking, so a test file can pass
        # at runtime and still be wrong. This is the step that catches that.
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run the test suite
        run: npm test

  build:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Work out the version and which tags to publish
        id: version
        run: |
          NS="${{ secrets.DOCKER_USERNAME }}/studzee-api"
          if [[ $GITHUB_REF == refs/tags/backend-v* ]]; then
            # A version tag is a release, so it moves `latest`.
            VERSION="${GITHUB_REF#refs/tags/backend-v}"
            TAGS="$NS:latest,$NS:$VERSION"
          else
            # A manual dispatch can run from any branch and is not a release, so
            # it publishes the commit SHA only. Tagging it `latest` would let an
            # unreleased branch become what a deploy target pulls.
            VERSION="${GITHUB_SHA::7}"
            TAGS="$NS:$VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: ${{ steps.version.outputs.TAGS }}
          # Standard OCI metadata, baked into the image itself rather than
          # carried by the registry, so `docker inspect` on a pulled image can
          # say what it is and which commit produced it.
          #
          # `github.repositoryUrl` is deliberately not used for the source
          # label. It yields a git protocol URL, git://github.com/owner/repo.git,
          # which is not a browsable address. server_url plus repository gives
          # the https one that tooling expects.
          labels: |
            org.opencontainers.image.title=studzee-api
            org.opencontainers.image.description=Express and TypeScript backend for the Studzee education platform
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Reuses layers across runs, which matters because the image now
          # installs the dependency tree twice, once in full for the build and
          # once with --omit=dev for the layer that ships.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Docker image information
        run: |
          echo "Docker image successfully built and pushed:"
          echo "${{ steps.version.outputs.TAGS }}" | tr ',' '\n' | sed 's/^/  - /'

      # The Docker Hub page text is a property of the repository, not of the
      # image, so it cannot be set by a label and needs the Hub REST API.
      #
      # Only on a release. A commit SHA build is not what the page should
      # describe, and rewriting the description on every dispatch is noise.
      #
      # Categories are deliberately not set here. They are chosen once from a
      # fixed list and then never change, so automating them would mean
      # shipping an API call whose payload shape cannot be verified from here,
      # in exchange for saving a single click. They are set in the repository
      # settings on Docker Hub.
      - name: Update the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/backend-v')
        env:
          # Passed as environment rather than interpolated into the command, so
          # the values are never part of a process argument list.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          # Docker Hub is moving off password login, but this endpoint still
          # accepts a personal access token in the password field, which is
          # what DOCKER_PASSWORD already holds for docker/login-action.
          TOKEN=$(curl -sS -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                  '{username: $u, password: $p}')" \
            | jq -r '.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Could not obtain a Docker Hub API token."
            echo "The image is already pushed. Only the page text is affected."
            exit 1
          fi

          # --arg reads the file as a literal string, so backticks, quotes and
          # newlines in the markdown cannot break out into the JSON.
          PAYLOAD=$(jq -nc \
            --arg short "studzee-api: Express and TypeScript backend for the Studzee education platform." \
            --rawfile full BACKEND/DOCKERHUB.md \
            '{description: $short, full_description: $full}')

          STATUS=$(curl -sS -o /tmp/hub-response.json -w '%{http_code}' \
            -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/studzee-api/" \
            -H "Authorization: JWT ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$STATUS" != "200" ]; then
            echo "Docker Hub returned HTTP ${STATUS}:"
            cat /tmp/hub-response.json
            exit 1
          fi

          echo "Docker Hub description updated from BACKEND/DOCKERHUB.md."

      # The container runs prisma migrate deploy before the app, so the deploy
      # target needs DATABASE_URL reachable at boot or it exits 1 with P1001.
      # # # Trigger Render deploy hook ( uncomment when using Render.com )
      # - name: Trigger Render deploy hook
      #   run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}
