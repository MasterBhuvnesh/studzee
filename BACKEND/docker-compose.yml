services:
  # The API itself, behind the `api` profile so it does not start by default.
  # `docker compose up -d` still brings up infrastructure only, which is what the
  # host workflow needs: the stack runs in Docker and the app runs on the host
  # under `npm run dev`, holding port 4000. Starting both without the profile
  # would fight over that port.
  #
  #   docker compose up -d                  infrastructure only, host runs the app
  #   docker compose --profile api up -d    infrastructure plus the API container
  #
  # Replaces running `docker run` by hand against the built image.
  api:
    build:
      context: .
      target: production
    image: studzee-backend:local
    container_name: studzee_api
    profiles: [api]
    restart: unless-stopped
    # The only env file that resolves the stack by compose service name. The
    # other two address localhost and are for a host process, despite the name
    # on .env.docker. Using them here fails at boot with P1001 from
    # prisma migrate deploy.
    env_file:
      - .env.container
    # The image declares EXPOSE 3000 and probes 3000 in its healthcheck, and
    # .env.container sets PORT=3000 to match. Publishing on 4000 keeps the URL
    # the same as the previous hand-run container.
    ports:
      - '${API_PORT:-4000}:3000'
    networks:
      - studzee-network
    # Every store has to be accepting connections before the entrypoint runs
    # prisma migrate deploy, or the container exits 1 rather than retrying.
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: studzee_mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    networks:
      - studzee-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Users, push tokens, and the notification and email audit logs.
  # Moved in from the notification service, which the backend now absorbs.
  postgres:
    image: postgres:16-alpine
    container_name: studzee_postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studzee_notifications}
    networks:
      - studzee-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis/redis-stack:latest
    container_name: studzee_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
      - '${REDIS_INSIGHT_PORT:-8001}:8001'
    volumes:
      - redis-data:/data
    networks:
      - studzee-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: studzee_minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    networks:
      - studzee-network
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://localhost:${MINIO_CONSOLE_PORT:-9001}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Creates the buckets MinIO needs and makes them publicly readable, so local
  # storage matches the Supabase project without a manual console step. MinIO
  # creates nothing on its own, so without this every upload fails with
  # NoSuchBucket. Runs once and exits.
  minio-init:
    image: minio/mc:latest
    container_name: studzee_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - studzee-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-miniopassword}"
        for bucket in "${S3_BUCKET_IMAGES:-images}" "${S3_BUCKET_PDFS:-pdfs}" assets; do
          mc mb --ignore-existing "local/$$bucket"
          mc anonymous set download "local/$$bucket"
        done
        mc ls local
        echo "minio buckets ready"

  # Local SMTP catcher. Accepts every message and shows it in a web UI instead
  # of delivering it, so development and tests never send real email.
  mailpit:
    image: axllent/mailpit:latest
    container_name: studzee_mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - studzee-network
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: studzee_mongo_express
    restart: unless-stopped
    ports:
      - '${MONGO_EXPRESS_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT:-27017}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-root}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-password}
    networks:
      - studzee-network
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
    name: studzee-mongo-data
  postgres-data:
    name: studzee-postgres-data
  redis-data:
    name: studzee-redis-data
  minio-data:
    name: studzee-minio-data
  mailpit-data:
    name: studzee-mailpit-data

networks:
  studzee-network:
    name: studzee_network
    driver: bridge
